<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joomla Playground</title>
  <style>
    :root {
      --bar: #1c2b4a;
      --bar-text: #f2f5fa;
      --muted: #b9c4d8;
      --accent: #f9a541;
      --error: #ff8a80;
      --page: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666666;
      --link: #1a5fb4;
      --link-border: #a7bfdc;
      --danger: #a51d2d;
      --danger-border: #c6a0a6;
      --line: #dddddd;
      --line-light: #eeeeee;
      --selected: #e8f0fb;
      --loading: #f2f5fa;
      --loading-text: #1c2b4a;
      color-scheme: light;
    }

    /* Dark mode follows the browser, as Joomla's administrator does (the site's front end, Cassiopeia, has none). */
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #1b2335;
        --text: #e6ebf4;
        --text-muted: #9aa6bb;
        --link: #8db8f0;
        --link-border: #46628a;
        --danger: #ff8a80;
        --danger-border: #7a4a4f;
        --line: #2c3750;
        --line-light: #253047;
        --selected: #263552;
        --loading: #0f151d;
        --loading-text: #e6ebf4;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--page);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      padding: 8px 16px;
      background: var(--bar);
      color: var(--bar-text);
      font-size: 14px;
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    header button {
      padding: 4px 12px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      background: transparent;
      color: var(--bar-text);
      font: inherit;
      cursor: pointer;
    }

    header button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #status { color: var(--accent); }
    #status.error { color: var(--error); white-space: pre-wrap; }
    #info, #credentials-label, .version { color: var(--muted); }

    .version select {
      padding: 2px 4px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      background: var(--bar);
      color: var(--bar-text);
      font: inherit;
    }
    #credentials { font-family: ui-monospace, Consolas, monospace; }
    .spacer { flex: 1; }

    #pull-request:not([hidden]) { display: contents; }
    #pull-request-link { color: var(--bar-text); }

    .separator {
      width: 1px;
      align-self: stretch;
      background: var(--muted);
      opacity: 0.4;
    }

    #sites-menu { position: relative; }

    #sites-menu summary {
      padding: 4px 12px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      cursor: pointer;
      list-style: none;
    }

    #sites-menu summary::-webkit-details-marker { display: none; }
    #sites-menu summary::after { content: " ▾"; }

    #sites-list {
      position: absolute;
      z-index: 10;
      top: calc(100% + 6px);
      left: 0;
      min-width: 320px;
      max-width: calc(100vw - 32px);
      margin: 0;
      padding: 6px 0;
      list-style: none;
      background: var(--page);
      color: var(--text);
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }

    #sites-list li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0 12px;
      padding: 6px 12px;
    }

    #sites-list li.empty { display: block; color: var(--text-muted); }
    #sites-list a { color: var(--link); font-weight: 600; }
    #sites-list .details { grid-column: 1; font-size: 12px; color: var(--text-muted); }
    #sites-list .actions { grid-row: 1 / span 2; grid-column: 2; align-self: center; display: flex; gap: 6px; }
    #sites-list button { color: var(--link); border-color: var(--link-border); }
    #sites-list button.delete { color: var(--danger); border-color: var(--danger-border); }

    #mail-count:not(:empty) {
      margin-left: 4px;
      padding: 0 6px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--bar);
      font-weight: 600;
    }

    #mail-dialog {
      width: min(1000px, calc(100vw - 32px));
      height: min(700px, calc(100vh - 64px));
      padding: 0;
      border: 0;
      border-radius: 8px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
      color: var(--text);
      background: var(--page);
    }

    #mail-dialog[open] { display: grid; grid-template-rows: auto 1fr; }
    #mail-dialog::backdrop { background: rgba(0, 0, 0, 0.4); }

    #mail-dialog header { justify-content: space-between; }
    #mail-dialog .body { display: grid; grid-template-columns: minmax(200px, 1fr) 2fr; min-height: 0; }

    #mail-list {
      margin: 0;
      padding: 0;
      overflow: auto;
      list-style: none;
      border-right: 1px solid var(--line);
    }

    #mail-list li { padding: 8px 12px; border-bottom: 1px solid var(--line-light); cursor: pointer; }
    #mail-list li.selected { background: var(--selected); }
    #mail-list li.empty { color: var(--text-muted); cursor: default; }
    #mail-list .subject { font-weight: 600; }
    #mail-list .meta { font-size: 12px; color: var(--text-muted); }

    #mail-view { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
    #mail-headers { margin: 0; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--line-light); }
    #mail-headers dt { float: left; clear: left; width: 64px; color: var(--text-muted); }
    #mail-headers dd { margin-left: 72px; }
    #mail-text { margin: 0; padding: 12px; overflow: auto; white-space: pre-wrap; font: 13px ui-monospace, Consolas, monospace; }
    #mail-html { width: 100%; height: 100%; border: 0; }

    @media (max-width: 640px) {
      #mail-dialog .body { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; }
      #mail-list { border-right: 0; border-bottom: 1px solid var(--line); }
    }

    #stage {
      position: relative;
      flex: 1;
      display: flex;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
    }

    /* While a playground starts: Joomla's own loader (joomla-core-loader) and what is happening. */
    #loading {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: var(--loading);
      color: var(--loading-text);
      font-size: 16px;
    }

    #loading[hidden] { display: none; }
    #loading.error #loading-status { color: var(--danger); }
    #loading.error joomla-core-loader { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Joomla Playground</h1>
    <button id="open-site" type="button" disabled>Site</button>
    <button id="open-admin" type="button" disabled>Administrator</button>
    <span class="separator"></span>
    <button id="new-site" type="button" disabled title="Start a new, empty playground">New</button>
    <button id="reset-site" type="button" disabled title="Throw this playground away and start again from the same link">Start over</button>
    <button id="save-site" type="button" disabled title="Keep this playground in your browser">Save…</button>
    <button id="export-site" type="button" disabled title="Download the whole site as a zip">Export</button>
    <button id="import-site" type="button" disabled title="Start a playground from an exported zip">Import…</button>
    <input id="import-file" type="file" accept=".zip,application/zip" hidden>
    <details id="sites-menu">
      <summary>My sites</summary>
      <ul id="sites-list"></ul>
    </details>
    <button id="mail" type="button" disabled title="The mails this site sent: they are caught, not delivered">Mail<span id="mail-count"></span></button>
    <span id="pull-request" hidden>
      <span class="separator"></span>
      <a id="pull-request-link" target="_blank" rel="noopener"></a>
      <button id="pull-request-toggle" type="button" disabled></button>
    </span>
    <span id="status">Loading</span>
    <span class="spacer"></span>
    <span><span id="credentials-label">Super User:</span> <span id="credentials">…</span></span>
    <label class="version">Joomla <select id="joomla-version" disabled title="Joomla version"></select></label>
    <label class="version">PHP <select id="php-version" disabled title="PHP version (WebAssembly)"></select></label>
    <span id="info"></span>
  </header>
  <div id="stage">
    <iframe id="joomla" title="Joomla"></iframe>
    <div id="loading" role="status" aria-live="polite">
      <joomla-core-loader inline size="160" color="transparent"></joomla-core-loader>
      <p id="loading-status">Loading</p>
    </div>
  </div>
  <dialog id="mail-dialog">
    <header>
      <h1>Mail sent by this playground</h1>
      <form method="dialog"><button type="submit">Close</button></form>
    </header>
    <div class="body">
      <ul id="mail-list"></ul>
      <div id="mail-view">
        <dl id="mail-headers"></dl>
        <pre id="mail-text"></pre>
      </div>
    </div>
  </dialog>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
