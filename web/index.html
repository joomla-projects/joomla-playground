<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joomla Playground</title>
  <link rel="icon" type="image/svg+xml" href="./joomla/joomla-favicon.svg">
  <link rel="preload" href="./joomla/versions.json" as="fetch" crossorigin fetchpriority="high">
  <link rel="modulepreload" href="./joomla/joomla-core-loader.js">
  <style>
    :root {
      --bar: #1c2b4a;
      --bar-text: #f2f5fa;
      --muted: #b9c4d8;
      --accent: #f9a541;
      --error: #ff8a80;
      --page: #ffffff;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body {
      block-size: 100%;
      margin: 0;
      background: var(--page);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      block-size: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 16px;
      background: var(--bar);
      color: var(--bar-text);
      font-size: 14px;
    }

    header :where(a:any-link, button, select, summary):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #sites-list :where(a:any-link, button):focus-visible {
      outline-color: var(--bar);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
    }

    .statusbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 16px;
      padding-block-start: 6px;
      border-block-start: 1px solid rgba(185, 196, 216, 0.2);
      font-size: 13px;
      line-height: 1.4;
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    header button {
      min-block-size: 26px;
      padding: 4px 12px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      background: transparent;
      color: var(--bar-text);
      font: inherit;
      cursor: pointer;
    }

    header button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #status {
      flex: 1 1 18rem;
      min-inline-size: 0;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    #status.error {
      color: var(--error);
      white-space: pre-wrap;
      overflow: visible;
    }

    #info, #credentials-label, .version { color: var(--muted); }

    .versions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      margin-inline-start: auto;
    }

    .version select {
      block-size: 26px;
      padding: 2px 4px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      background: var(--bar);
      color: var(--bar-text);
      font: inherit;
    }

    #joomla-version { inline-size: 5.5rem; }
    #php-version { inline-size: 4rem; }

    .credentials {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0 4px;
      max-inline-size: 100%;
    }

    #credentials {
      display: inline-block;
      min-inline-size: min(32ch, calc(100dvw - 32px));
      max-inline-size: 100%;
      overflow-wrap: anywhere;
      font-family: ui-monospace, Consolas, monospace;
    }

    #info {
      display: inline-block;
      min-inline-size: min(28ch, calc(100dvw - 32px));
      min-block-size: 1lh;
      white-space: nowrap;
    }

    #pull-request:not([hidden]) { display: contents; }
    #pull-request-link { color: var(--bar-text); }

    .separator {
      inline-size: 1px;
      align-self: stretch;
      background: var(--muted);
      opacity: 0.4;
    }

    #sites-menu { position: relative; }

    #sites-menu summary {
      min-block-size: 26px;
      padding: 4px 12px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      cursor: pointer;
      list-style: none;
    }

    #sites-menu summary::-webkit-details-marker { display: none; }
    #sites-menu summary::after { content: " ▾"; }

    #sites-list {
      position: absolute;
      z-index: 10;
      inset-block-start: calc(100% + 6px);
      inset-inline-start: 0;
      min-inline-size: 320px;
      max-inline-size: calc(100dvw - 32px);
      margin: 0;
      padding: 6px 0;
      list-style: none;
      background: var(--page);
      color: #1a1a1a;
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }

    #sites-list li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0 12px;
      padding: 6px 12px;
    }

    #sites-list li.empty { display: block; color: #666; }
    #sites-list a { color: #1a5fb4; font-weight: 600; }
    #sites-list .details { grid-column: 1; font-size: 12px; color: #666; }
    #sites-list .actions { grid-row: 1 / span 2; grid-column: 2; align-self: center; display: flex; gap: 6px; }
    #sites-list button { color: #1a5fb4; border-color: #a7bfdc; }
    #sites-list button.delete { color: #a51d2d; border-color: #c6a0a6; }

    #mail-count:not(:empty) {
      margin-inline-start: 4px;
      padding: 0 6px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--bar);
      font-weight: 600;
    }

    #mail-dialog {
      inline-size: min(1000px, calc(100% - 32px));
      block-size: min(700px, calc(100dvh - 64px));
      padding: 0;
      border: 0;
      border-radius: 8px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
      color: #1a1a1a;
      background: var(--page);
    }

    #mail-dialog[open] { display: grid; grid-template-rows: auto 1fr; }
    #mail-dialog::backdrop { background: rgba(0, 0, 0, 0.4); }

    #mail-dialog header { flex-direction: row; align-items: center; justify-content: space-between; }
    #mail-dialog .body { display: grid; grid-template-columns: minmax(200px, 1fr) 2fr; min-block-size: 0; }

    #mail-list {
      margin: 0;
      padding: 0;
      overflow: auto;
      overscroll-behavior: contain;
      list-style: none;
      border-inline-end: 1px solid #ddd;
    }

    #mail-list li { padding: 8px 12px; border-block-end: 1px solid #eee; cursor: pointer; }
    #mail-list li.selected { background: #e8f0fb; }
    #mail-list li.empty { color: #666; cursor: default; }
    #mail-list .subject { font-weight: 600; }
    #mail-list .meta { font-size: 12px; color: #666; }

    #mail-view { display: grid; grid-template-rows: auto 1fr; min-block-size: 0; }
    #mail-headers { margin: 0; padding: 8px 12px; font-size: 13px; border-block-end: 1px solid #eee; }
    #mail-headers dt { float: inline-start; clear: inline-start; inline-size: 64px; color: #666; }
    #mail-headers dd { margin-inline-start: 72px; }
    #mail-text { margin: 0; padding: 12px; overflow: auto; overscroll-behavior: contain; white-space: pre-wrap; font: 13px ui-monospace, Consolas, monospace; }
    #mail-html { display: block; inline-size: 100%; block-size: 100%; border: 0; }

    @media (max-width: 640px) {
      #mail-dialog .body { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; }
      #mail-list { border-inline-end: 0; border-block-end: 1px solid #ddd; }
    }

    #stage {
      position: relative;
      flex: 1;
      min-block-size: 0;
      display: flex;
    }

    iframe {
      display: block;
      flex: 1;
      inline-size: 100%;
      border: 0;
    }

    /* While a playground starts: Joomla's own loader (joomla-core-loader) and what is happening. */
    #loading {
      position: absolute;
      inset: 0;
      z-index: 5;
      contain: layout style paint;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #f2f5fa;
      color: #1c2b4a;
      font-size: 16px;
    }

    /* Reserve the loader's size before the custom element upgrades, preventing CLS. */
    joomla-core-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      inline-size: 160px;
      block-size: 160px;
      flex-shrink: 0;
    }

    #loading-status {
      margin: 0;
      inline-size: 100%;
      padding-inline: 16px;
      min-block-size: 2lh;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    #loading[hidden] { display: none; }
    #loading.error #loading-status { color: #a51d2d; }
    #loading.error joomla-core-loader { visibility: hidden; }
  </style>
</head>
<body>
  <header>
    <div class="toolbar">
      <h1>Joomla Playground</h1>
      <button id="open-site" type="button" disabled>Site</button>
      <button id="open-admin" type="button" disabled>Administrator</button>
      <span class="separator" aria-hidden="true"></span>
      <button id="new-site" type="button" disabled title="Start a new, empty playground">New</button>
      <button id="reset-site" type="button" disabled title="Throw this playground away and start again from the same link">Start over</button>
      <button id="save-site" type="button" disabled title="Keep this playground in your browser">Save…</button>
      <button id="export-site" type="button" disabled title="Download the whole site as a zip">Export</button>
      <button id="import-site" type="button" disabled title="Start a playground from an exported zip">Import…</button>
      <input id="import-file" type="file" accept=".zip,application/zip" hidden>
      <details id="sites-menu">
        <summary>My sites</summary>
        <ul id="sites-list"></ul>
      </details>
      <button id="mail" type="button" disabled title="The mails this site sent: they are caught, not delivered">Mail<span id="mail-count"></span></button>
      <span id="pull-request" hidden>
        <span class="separator" aria-hidden="true"></span>
        <a id="pull-request-link" target="_blank" rel="noopener"></a>
        <button id="pull-request-toggle" type="button" disabled></button>
      </span>
      <span class="versions">
        <label class="version" for="joomla-version">Joomla <select id="joomla-version" disabled title="Joomla version"></select></label>
        <label class="version" for="php-version">PHP <select id="php-version" disabled title="PHP version (WebAssembly)"></select></label>
      </span>
    </div>
    <div class="statusbar">
      <span id="status">Loading</span>
      <span class="credentials"><span id="credentials-label">Super User:</span> <span id="credentials">…</span></span>
      <span id="info"></span>
    </div>
  </header>
  <main id="stage">
    <iframe id="joomla" title="Joomla"></iframe>
    <div id="loading" role="status">
      <joomla-core-loader inline size="160" color="transparent" aria-hidden="true"></joomla-core-loader>
      <p id="loading-status">Loading</p>
    </div>
  </main>
  <dialog id="mail-dialog" closedby="any" aria-labelledby="mail-dialog-title">
    <header>
      <h1 id="mail-dialog-title">Mail sent by this playground</h1>
      <form method="dialog"><button type="submit">Close</button></form>
    </header>
    <div class="body">
      <ul id="mail-list"></ul>
      <div id="mail-view">
        <dl id="mail-headers"></dl>
        <pre id="mail-text"></pre>
      </div>
    </div>
  </dialog>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
